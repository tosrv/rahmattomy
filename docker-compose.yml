services:
  portfolio:
    image: ghcr.io/tosrv/rahmattomy:latest
    container_name: portfolio

    restart: unless-stopped

    ports:
      - "3001:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "http://localhost:80",
          "-O",
          "-",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
